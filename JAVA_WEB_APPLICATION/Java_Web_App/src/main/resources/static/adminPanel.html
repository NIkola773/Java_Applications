<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
    header { background-color: #d32f2f; color: white; text-align: center; padding: 20px; }
    main { max-width: 1000px; margin: 30px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { color: #d32f2f; }
    h2 { color: #d32f2f; }
</style>
</head>
<body>
<header>
    <h1>Admin Panel</h1>
    <p>Manage users and products securely</p>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</header>
<main>
    <section>
        <h2>Users</h2>
        <button class="btn btn-danger mb-3" onclick="loadUsers()">Load All Users</button>
        <table class="table table-bordered" id="userTable" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </section>
</main>
 
<script>
async function loadUsers() {
    const response = await fetch("/users/allUsers");
    const users = await response.json();
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";
    users.forEach(u => {
        const tr = document.createElement("tr");
        tr.id = "user-row-" + u.userId;
        tr.innerHTML = `
            <td>${u.userId}</td>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td>${u.age}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${u.userId})">Delete</button></td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById("userTable").style.display = "";
}
 
async function deleteUser(id) {
    await fetch("/users/deleteUser/" + id, { method: "DELETE" });
    document.getElementById("user-row-" + id).remove();
}
</script>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
