<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { color: #d32f2f; text-align: center; margin-bottom: 24px; }
    .btn-danger { background-color: #d32f2f; border-color: #d32f2f; }
    .btn-danger:hover { background-color: #b71c1c; border-color: #b71c1c; }
</style>
</head>
<body>
<div class="login-card">
    <h2>Admin Login</h2>
 
    <div th:if="${param.error}" class="alert alert-danger">Wrong username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
 
    <form method="post" action="/login">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" placeholder="admin">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-danger w-100">Login</button>
    </form>
</div>
</body>
</html>
