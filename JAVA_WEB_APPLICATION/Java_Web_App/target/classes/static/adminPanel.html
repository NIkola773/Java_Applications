<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
    header { background-color: #d32f2f; color: white; text-align: center; padding: 20px; }
    main { max-width: 1000px; margin: 30px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { color: #d32f2f; }
    h2 { color: #d32f2f; }
</style>
</head>
<body>
<header>
    <h1>Admin Panel</h1>
    <p>Manage users and products securely</p>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</header>
<main>
    <section>
        <h2>Users</h2>
        <button class="btn btn-danger mb-3" onclick="loadUsers()">Load All Users</button>
        <table class="table table-bordered" id="userTable" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </section>

    <section style="margin-top: 40px;">
        <h2>Products</h2>
        <button class="btn btn-danger mb-3" onclick="loadProducts()">Load All Products</button>
        <table class="table table-bordered" id="productTableAdmin" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </section>

    <section style="margin-top: 40px;">
        <h2>Addresses</h2>
        <button class="btn btn-danger mb-3" onclick="loadAddresses()">Load All Addresses</button>
        <table class="table table-bordered" id="addressTableAdmin" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Country</th>
                    <th>Street</th>
                    <th>Username</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="addressTableBody"></tbody>
        </table>
    </section>
</main>
 
<script>
async function loadUsers() {
    const response = await fetch("/users/allUsers");
    const users = await response.json();
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";
    users.forEach(u => {
        const tr = document.createElement("tr");
        tr.id = "user-row-" + u.userId;
        tr.innerHTML = `
            <td>${u.userId}</td>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td>${u.age}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editUser(${u.userId})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.userId})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById("userTable").style.display = "";
}
 
async function deleteUser(id) {
    await fetch("/users/deleteUser/" + id, { method: "DELETE" });
    document.getElementById("user-row-" + id).remove();
}

function editUser(id) {
    const row = document.getElementById("user-row-" + id);
    const cells = row.querySelectorAll("td");
    const username = cells[1].textContent;
    const email = cells[2].textContent;
    const age = cells[3].textContent;
    cells[1].innerHTML = `<input class="form-control form-control-sm" id="edit-username-${id}" value="${username}">`;
    cells[2].innerHTML = `<input class="form-control form-control-sm" id="edit-email-${id}" value="${email}">`;
    cells[3].innerHTML = `<input class="form-control form-control-sm" id="edit-age-${id}" value="${age}">`;
    cells[4].innerHTML = `
        <button class="btn btn-success btn-sm" onclick="saveUser(${id})">Save</button>
        <button class="btn btn-secondary btn-sm" onclick="loadUsers()">Cancel</button>
    `;
}

async function saveUser(id) {
    const username = document.getElementById("edit-username-" + id).value;
    const email = document.getElementById("edit-email-" + id).value;
    const age = document.getElementById("edit-age-" + id).value;
    await fetch("/users/updateUser/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, email: email, age: Number(age) })
    });
    loadUsers();
}

async function loadProducts() {
    const response = await fetch("/products");
    const products = await response.json();
    const tbody = document.getElementById("productTableBody");
    tbody.innerHTML = "";
    products.forEach(p => {
        const tr = document.createElement("tr");
        tr.id = "product-row-" + p.id;
        tr.innerHTML = `
            <td>${p.id}</td>
            <td>${p.productName}</td>
            <td>${p.price}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editProduct(${p.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById("productTableAdmin").style.display = "";
}

async function deleteProduct(id) {
    await fetch("/deleteProduct/" + id, { method: "DELETE" });
    document.getElementById("product-row-" + id).remove();
}

function editProduct(id) {
    const row = document.getElementById("product-row-" + id);
    const cells = row.querySelectorAll("td");
    const name = cells[1].textContent;
    const price = cells[2].textContent;
    cells[1].innerHTML = `<input class="form-control form-control-sm" id="edit-pname-${id}" value="${name}">`;
    cells[2].innerHTML = `<input class="form-control form-control-sm" id="edit-pprice-${id}" value="${price}">`;
    cells[3].innerHTML = `
        <button class="btn btn-success btn-sm" onclick="saveProduct(${id})">Save</button>
        <button class="btn btn-secondary btn-sm" onclick="loadProducts()">Cancel</button>
    `;
}

async function saveProduct(id) {
    const name = document.getElementById("edit-pname-" + id).value;
    const price = document.getElementById("edit-pprice-" + id).value;
    await fetch("/updateProduct/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ productName: name, price: parseFloat(price) })
    });
    loadProducts();
}

async function loadAddresses() {
    const response = await fetch("/address/allAddress");
    const addresses = await response.json();
    const tbody = document.getElementById("addressTableBody");
    tbody.innerHTML = "";
    addresses.forEach(a => {
        const tr = document.createElement("tr");
        tr.id = "address-row-" + a.id;
        tr.innerHTML = `
            <td>${a.id}</td>
            <td>${a.name}</td>
            <td>${a.email}</td>
            <td>${a.country}</td>
            <td>${a.street}</td>
            <td>${a.username}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editAddress(${a.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteAddress(${a.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById("addressTableAdmin").style.display = "";
}

async function deleteAddress(id) {
    await fetch("/address/deleteAddress/" + id, { method: "DELETE" });
    document.getElementById("address-row-" + id).remove();
}

function editAddress(id) {
    const row = document.getElementById("address-row-" + id);
    const cells = row.querySelectorAll("td");
    const name = cells[1].textContent;
    const email = cells[2].textContent;
    const country = cells[3].textContent;
    const street = cells[4].textContent;
    const username = cells[5].textContent;
    cells[1].innerHTML = `<input class="form-control form-control-sm" id="edit-aname-${id}" value="${name}">`;
    cells[2].innerHTML = `<input class="form-control form-control-sm" id="edit-aemail-${id}" value="${email}">`;
    cells[3].innerHTML = `<input class="form-control form-control-sm" id="edit-acountry-${id}" value="${country}">`;
    cells[4].innerHTML = `<input class="form-control form-control-sm" id="edit-astreet-${id}" value="${street}">`;
    cells[5].innerHTML = `<input class="form-control form-control-sm" id="edit-ausername-${id}" value="${username}">`;
    cells[6].innerHTML = `
        <button class="btn btn-success btn-sm" onclick="saveAddress(${id})">Save</button>
        <button class="btn btn-secondary btn-sm" onclick="loadAddresses()">Cancel</button>
    `;
}

async function saveAddress(id) {
    const name = document.getElementById("edit-aname-" + id).value;
    const email = document.getElementById("edit-aemail-" + id).value;
    const country = document.getElementById("edit-acountry-" + id).value;
    const street = document.getElementById("edit-astreet-" + id).value;
    const username = document.getElementById("edit-ausername-" + id).value;
    await fetch("/address/updateAddress/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, email: email, country: country, street: street, username: username })
    });
    loadAddresses();
}
</script>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
